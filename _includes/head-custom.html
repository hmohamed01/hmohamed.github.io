<link rel="icon" href="{{ '/favicon-32.png' | relative_url }}" sizes="32x32" type="image/png">
<link rel="icon" href="{{ '/favicon.svg' | relative_url }}" type="image/svg+xml">
<link rel="apple-touch-icon" href="{{ '/apple-touch-icon.png' | relative_url }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cascadia+Code:wght@400;700&display=swap">
<style>
  .console-splat {
    margin: -15px -20px 25px;
    padding: 16px 20px;
    background: linear-gradient(#0A3D7A, #011E45);
    color: #C9E9FF;
    font-family: 'Cascadia Code', ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 13px;
    line-height: 1.7;
  }

  .console-splat code {
    color: inherit;
    font-family: inherit;
    font-size: inherit;
  }

  .console-splat a {
    color: #C9E9FF;
    border-bottom: 1px solid rgba(123, 232, 255, 0.3);
  }

  .console-splat a:hover {
    color: #7BE8FF;
    border-bottom-color: #7BE8FF;
  }

  .console-splat a:focus-visible {
    outline: 2px solid #7BE8FF;
    outline-offset: 3px;
    border-bottom-color: transparent;
  }

  .tok-prompt,
  .tok-var {
    color: #7BE8FF;
    font-weight: 700;
  }

  .tok-key {
    color: #E3F0FF;
  }

  .tok-op {
    color: #3D8FE0;
  }

  .console-cursor {
    display: inline-block;
    width: 8px;
    height: 15px;
    margin-left: 4px;
    vertical-align: text-bottom;
    background: #3D8FE0;
    animation: console-blink 1.4s steps(1) infinite;
  }

  @keyframes console-blink {
    50% { opacity: 0; }
  }

  @media (prefers-reduced-motion: reduce) {
    .console-cursor { animation: none; }
    .copy-code { transition: none; }
  }

  div[class*="language-"]:not(.language-plaintext) {
    position: relative;
  }

  .copy-code {
    position: absolute;
    top: 10px;
    right: -10px;
    z-index: 1;
    padding: 4px 10px;
    border: 1px solid rgba(123, 232, 255, 0.35);
    border-radius: 4px;
    background: rgba(1, 30, 69, 0.85);
    color: #C9E9FF;
    font-family: 'Cascadia Code', ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 11px;
    cursor: pointer;
    transition: color .15s, border-color .15s, background-color .15s;
  }

  .copy-code:hover {
    color: #7BE8FF;
    border-color: #7BE8FF;
    background: #011E45;
  }

  .copy-code:focus-visible {
    outline: 2px solid #7BE8FF;
    outline-offset: 2px;
  }

  .copy-code[data-state="done"] {
    color: #7BE8FF;
    border-color: #7BE8FF;
  }

  @media print {
    .copy-code { display: none; }
  }
</style>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    const copyKey = /Mac|iPhone|iPad/.test(navigator.userAgent) ? '\u2318C' : 'Ctrl+C';

    document.querySelectorAll('div[class*="language-"]:not(.language-plaintext)').forEach((block) => {
      const code = block.querySelector('pre code');
      if (!code) return;

      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'copy-code';
      button.textContent = 'Copy';
      button.setAttribute('aria-label', 'Copy code to clipboard');

      let resetTimer;
      button.addEventListener('click', async () => {
        clearTimeout(resetTimer);
        try {
          await navigator.clipboard.writeText(code.textContent);
          button.textContent = 'Copied';
        } catch {
          const range = document.createRange();
          range.selectNodeContents(code);
          const selection = window.getSelection();
          selection.removeAllRanges();
          selection.addRange(range);
          button.textContent = 'Press ' + copyKey;
        }
        button.dataset.state = 'done';
        resetTimer = setTimeout(() => {
          button.textContent = 'Copy';
          delete button.dataset.state;
        }, 2000);
      });

      block.appendChild(button);
    });
  });
</script>
