title: Hatem Mohamed
description: Notes on Windows endpoint management — Intune, ConfigMgr, and PowerShell

# User site, so it serves from the domain root. Leave baseurl empty.
baseurl: ""
url: "https://hmohamed01.github.io"

remote_theme: pages-themes/modernist@v0.2.0
plugins:
  - jekyll-remote-theme

# CLAUDE.md is agent documentation, not site content. Without this,
# jekyll-optional-front-matter renders it as a page and Liquid chokes on
# the template tags it quotes as examples.
exclude:
  - CLAUDE.md
  - Gemfile
  - Gemfile.lock
  - vendor/
